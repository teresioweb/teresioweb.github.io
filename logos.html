<main id="main" tabindex="-1">
  <h1>Logos 27</h1>
  <p class="page-subtitle">&laquo;Un gioiello di genialit&agrave; e creativit&agrave;&raquo;.</p>

  <figure class="reveal-img side color-band" style="--band-color:#CEDCE6;">
    <div class="side-row">
      <a href="pdf/NotizieOlivetti.pdf" target="_blank" rel="noopener">
      <img src="images/logos-pintori.webp" width="1200" height="1204" alt="Grafica di Giovanni Pintori per la Logos 27">
      <span class="img-badge">PDF</span>
    </a>
      <figcaption>
        <p>La Logos 27 in quattro articoli su <em>notizie olivetti</em>.<br>
      <strong>&gt; La &ldquo;Logos&rdquo; e il mercato delle calcolatrici.</strong> Un articolo di Francesco Mascaro, del Centro Studi Olivetti.<br>
      <strong>&gt; Il progetto della &ldquo;Logos&rdquo;.</strong> Una nota di Teresio Gassino, che con un gruppo di collaboratori ha progettato questa macchina.<br>
      <strong>&gt; Il design della &ldquo;Logos&rdquo;.</strong> Un articolo dell&rsquo;architetto Ettore Sottsass jr., che ha realizzato la carrozzeria della nuova calcolatrice Olivetti.<br>
      <strong>&gt; Dove si produce la &ldquo;Logos&rdquo;.</strong></p>
      </figcaption>
    </div>
    <div class="side-row fonte-row">
      <span class="side-row-spacer"></span>
      <p class="fonte">Fonte: <em>notizie olivetti, n. 85, dicembre 1965</em>, Ufficio Stampa Olivetti, pp. 32&ndash;49.</p>
    </div>
  </figure>

  <figure class="reveal-img side from-right color-band" style="--band-color:#FCC1C1;">
    <div class="side-row">
      <a href="pdf/Opuscolo1.pdf" target="_blank" rel="noopener">
      <img src="images/logos-opuscolo.webp" width="800" height="563" alt="Copertina dell’opuscolo informativo della Logos 27-2">
      <span class="img-badge">PDF</span>
    </a>
      <figcaption>
        <p><strong>Olivetti Logos 27-2</strong>, opuscolo informativo (1967).<br>
      Un opuscolo con grafica di Giovanni Pintori presentava la versione 27-1 della Logos (1966, <a href="pdf/Opuscolo2.pdf" target="_blank" rel="noopener">pdf&nbsp;disponibile</a> in lingua olandese). Una sequenza video presentava la Logos insieme ad altri prodotti Olivetti (<a href="https://www.youtube.com/watch?v=lfbH4H8zvMU" target="_blank" rel="noopener">link</a>).</p>
        <p class="fonte">Fonte: <a href="https://archive.org/details/olivettilogos272/" target="_blank" rel="noopener">Olivetti Logos&nbsp;27-2</a>, <em>Internet Archive</em>, <a href="https://oa.letterformarchive.org/item?workID=lfa_pintori_0011" target="_blank" rel="noopener">Olivetti Logos&nbsp;27</a>, <em>Letterform Archive</em>, consultati nel novembre 2020.</p>
      </figcaption>
    </div>
  </figure>

  <figure class="reveal-img side color-band" style="--band-color:#FEE8B2;">
    <div class="side-row">
      <a href="https://web.archive.org/web/20190709182245/http://ananke.blog.lemonde.fr/tag/logos-27-2/" target="_blank" rel="noopener">
      <img src="images/ranimer-belle-mecanique.webp" width="800" height="533" alt="Vista dall’alto della meccanica della Logos 27">
      <span class="img-badge">&#8599; Link</span>
    </a>
      <figcaption>
        <p><strong><span lang="fr">Ranimer une belle m&eacute;canique</span>, la super-calculatrice Logos&nbsp;27-2</strong> (2013, lingua francese).<br>
      Straordinario lavoro di studio, ingegneria inversa e rimessa in funzione di una Logos 27-2 da parte dell&rsquo;ingegnere e appassionato di macchine da calcolo meccaniche Philippe Bastide. Al lavoro hanno contribuito le conoscenze di Alain Billerey, collezionista di macchine da calcolo (a questo <a href="https://www.youtube.com/watch?v=8Ra22FApGu0" target="_blank" rel="noopener">link&nbsp;video</a> &egrave; riconoscibile mentre mostra in funzione Logos, Divisumma e Tetractys della sua collezione).</p>
      </figcaption>
    </div>
    <div class="side-row fonte-row">
      <span class="side-row-spacer"></span>
      <p class="fonte">Fonte: <a href="https://web.archive.org/web/20190709182245/http://ananke.blog.lemonde.fr/tag/logos-27-2/" target="_blank" rel="noopener"><em>L&rsquo;oeil num&eacute;rique</em></a>, archiviato su <em>Internet Archive</em> nel luglio 2019.</p>
    </div>
  </figure>

  <figure class="reveal-img side from-right color-band" style="--band-color:#FFDDC2;">
    <div class="side-row">
      <a href="https://archive.org/details/mc-27-einstellungen-rid" target="_blank" rel="noopener">
      <img src="images/einstellungen.webp" width="800" height="566" alt="Copertina del manuale delle regolazioni Einstellungen">
      <span class="img-badge img-badge-left">&#8599; Link</span>
    </a>
      <figcaption>
        <p><strong>Olivetti Logos 27 <span lang="de">Einstellungen</span></strong>, manuale delle regolazioni (1968, lingua tedesca).<br>
      Il tecnico STAC (<a href="https://www.storiaolivetti.it/articolo/108-organizzazione-e-formazione-per-lassistenza-te/" target="_blank" rel="noopener">Servizio Tecnico Assistenza Clienti</a>) aveva a disposizione, oltre al manuale delle regolazioni, una <em>Guida localizzazione parti</em> (1969, <a href="https://archive.org/details/mc-27-glp-rid" target="_blank" rel="noopener">link</a>) con coordinate spaziali per orientarsi tra le sezioni della macchina e diagnosticare con precisione un malfunzionamento sul manuale di ricerca guasti (<em>Logos 27-2 <span lang="de">Fehlersuche</span></em>, 1968, <a href="https://archive.org/details/mc-27-fehlerreparatur-alles-rid" target="_blank" rel="noopener">link</a> in lingua tedesca).</p>
      </figcaption>
    </div>
    <div class="side-row fonte-row">
      <span class="side-row-spacer"></span>
      <p class="fonte">Fonte: <em>Internet Archive</em>, link consultati nell&rsquo;agosto 2026.</p>
    </div>
  </figure>
