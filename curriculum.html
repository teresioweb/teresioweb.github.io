<main id="main" tabindex="-1">
  <h1>Curriculum</h1>
  <p class="page-subtitle">La carriera, da allievo del CFM Olivetti a Direttore Centrale.</p>

  <figure class="reveal-img side from-right align-top color-band" style="--band-color:#FFDDC2;">
    <div class="side-row">
      <a href="images/curriculum-fronte.jpg" target="_blank" rel="noopener">
      <img src="images/curriculum-fronte.webp" width="1200" height="849" alt="Scansione in due pagine del curriculum vitae">
      <span class="img-badge">&#10530; Immagine</span>
    </a>
      <figcaption>
      <p><strong>Curriculum vitae</strong> compilato da Teresio presumibilmente in un momento successivo alla nomina a Dirigente del 1956, quando &egrave; responsabile del coordinamento tecnico dei progetti in corso presso tutti gli uffici (Progetto Macchine da Calcolo, Studi e Progetti Macchine Speciali, Progetto Apparecchiature Speciali) e responsabile diretto di alcuni dei progetti.</p>
      <p class="fonte">Fonte: archivio personale (<a href="pdf/Curriculum.pdf" target="_blank" rel="noopener">pdf&nbsp;disponibile</a>).</p>
    </figcaption>
    </div>
  </figure>

  <figure class="reveal-img side from-right align-top color-band" style="--band-color:#FEE8B2;">
    <div class="side-row">
      <a href="images/diploma-cfm.jpg" target="_blank" rel="noopener" class="doc-viewer-trigger" data-doc-src="images/diploma-cfm.jpg" data-doc-alt="Scansione del certificato di qualificazione per Disegnatori del CFM">
      <img src="images/diploma-cfm.webp" width="800" height="565" alt="Scansione del certificato di qualificazione per Disegnatori del CFM">
      <span class="img-badge">&#10530; Ingrandisci</span>
    </a>
      <figcaption>
      <p>Nel 1942 consegue la qualificazione di <strong>Disegnatore</strong> presso il Centro Formazione Meccanici Olivetti.</p>
      <p class="fonte">Fonte: archivio personale.</p>
    </figcaption>
    </div>
  </figure>

  <figure class="reveal-img side from-right align-top crop-top color-band" style="--band-color:#CEDCE6;">
    <div class="side-row">
      <a href="images/teresio-cavaliere.jpg" target="_blank" rel="noopener" class="doc-viewer-trigger" data-doc-src="images/teresio-cavaliere.jpg" data-doc-alt="Diploma dell’onorificenza di Cavaliere">
      <img src="images/teresio-cavaliere.webp" width="800" height="1090" alt="Diploma dell’onorificenza di Cavaliere">
      <span class="img-badge">&#10530; Ingrandisci</span>
    </a>
      <figcaption>
      <p>Nel 1962 &egrave; nominato <strong>Cavaliere</strong> dell&rsquo;Ordine al Merito della Repubblica Italiana.</p>
      <p class="fonte">Fonte: archivio personale.</p>
    </figcaption>
    </div>
  </figure>

  <figure class="reveal-img side from-right align-top color-band" style="--band-color:#FCC1C1;">
    <div class="side-row">
      <a href="https://rechnerlexikon.de/it/artikel/Spezial:Patentpage&amp;details=Olivetti" target="_blank" rel="noopener">
      <img src="images/brevetto.webp" width="800" height="615" alt="Disegno di brevetto di calcolatore meccanico">
      <span class="img-badge">&#8599; Link</span>
    </a>
      <figcaption>
      <p><strong>Brevetti</strong> di Teresio depositati intorno al 1966 presso l&rsquo;Ufficio brevetti degli Stati Uniti (pdf del brevetto e anno di concessione accanto al nome).</p>
      <div class="text-window">
      <p>&gt; <a href="pdf/US%203260449.pdf" target="_blank" rel="noopener">3,260,449</a>, 1966, Zero printing control device for a calculating machine.<br>
      &gt; <a href="pdf/US%203319882.pdf" target="_blank" rel="noopener">3,319,882</a>, 1967, Ten key calculating machine.<br>
      &gt; <a href="pdf/US%203331556.pdf" target="_blank" rel="noopener">3,331,556</a>, 1967, Power driving device for a calculating machine.<br>
      &gt; <a href="pdf/US%203370788.pdf" target="_blank" rel="noopener">3,370,788</a>, 1968, Program control device for a calculating or like machine.<br>
      &gt; <a href="pdf/US%203397837.pdf" target="_blank" rel="noopener">3,397,837</a>, 1968, Printing calculating machine having a transversely movable register.<br>
      &gt; <a href="pdf/US%203423018.pdf" target="_blank" rel="noopener">3,423,018</a>, 1969, Ten key calculating machine adapted to effect multiplications as well as divisions.<br>
      &gt; <a href="pdf/US%203451616.pdf" target="_blank" rel="noopener">3,451,616</a>, 1969, Automatic shortcut multiplication device for a calculating machine.</p>
      </div>
    </figcaption>
    </div>
    <div class="side-row fonte-row">
      <span class="side-row-spacer"></span>
      <p class="fonte">Fonte: <a href="https://www.arithmeum.uni-bonn.de/sammlungen/rechnen-einst/objekt.html?tx_arithinventory%5Bobject%5D=8410&amp;L=0" target="_blank" rel="noopener"><em>Arithmeum</em></a>, Universit&agrave; di Bonn, <a href="https://rechnerlexikon.de/it/artikel/Spezial:Patentpage&amp;details=Olivetti" target="_blank" rel="noopener"><em>Spezial:Patentpage (Olivetti)</em></a>, Rechnerlexikon, consultati nell&rsquo;agosto 2026.</p>
    </div>
  </figure>
