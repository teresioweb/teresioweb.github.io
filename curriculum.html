<main id="main" tabindex="-1">
  <h1>Curriculum</h1>
  <p class="page-subtitle">La carriera, da allievo del CFM Olivetti a Direttore Centrale.</p>

  <figure class="reveal-img side from-right align-top color-band" style="--band-color:#FFDDC2;">
    <div class="side-row">
      <a href="pdf/Curriculum.pdf" target="_blank" rel="noopener">
      <img src="images/curriculum-fronte.webp" width="1200" height="849" alt="Scansione in due pagine del curriculum vitae">
      <span class="img-badge">PDF</span>
    </a>
      <figcaption>
      <h2 class="visually-hidden">Curriculum vitae</h2>
      <p><strong>Curriculum vitae</strong> compilato da Teresio presumibilmente in un momento successivo alla nomina a Dirigente del 1956, quando &egrave; responsabile del coordinamento tecnico dei progetti in corso presso tutti gli uffici (Progetto Macchine da Calcolo, Studi e Progetti Macchine Speciali, Progetto Apparecchiature Speciali) e responsabile diretto di alcuni dei progetti.</p>
      <p class="fonte">Fonte: archivio personale.</p>
    </figcaption>
    </div>
  </figure>

  <figure class="reveal-img side from-right align-top color-band" style="--band-color:#FEE8B2;">
    <div class="side-row">
      <a href="images/diploma-cfm-full.webp" target="_blank" rel="noopener" class="doc-viewer-trigger" data-doc-src="images/diploma-cfm-full.webp" data-doc-alt="Scansione del certificato di qualificazione per Disegnatori del CFM" data-doc-fit="height" data-text-target="text-diploma-cfm">
      <img src="images/diploma-cfm.webp" width="800" height="565" alt="Scansione del certificato di qualificazione per Disegnatori del CFM">
      <span class="img-badge">&#10530; Ingrandisci</span>
    </a>
      <figcaption>
      <h2 class="visually-hidden">Diploma del Centro Formazione Meccanici</h2>
      <p>Nel 1942 consegue la qualificazione di <strong>Disegnatore</strong> presso il Centro Formazione Meccanici Olivetti.</p>
      <p class="fonte">Fonte: archivio personale.</p>
    </figcaption>
    </div>
  </figure>

  <figure class="reveal-img side from-right align-top crop-top color-band" style="--band-color:#CEDCE6;">
    <div class="side-row">
      <a href="images/teresio-cavaliere-full.webp" target="_blank" rel="noopener" class="doc-viewer-trigger" data-doc-src="images/teresio-cavaliere-full.webp" data-doc-alt="Diploma dell’onorificenza di Cavaliere" data-doc-fit="height" data-text-target="text-teresio-cavaliere">
      <img src="images/teresio-cavaliere.webp" width="800" height="1090" alt="Diploma dell’onorificenza di Cavaliere">
      <span class="img-badge">&#10530; Ingrandisci</span>
    </a>
      <figcaption>
      <h2 class="visually-hidden">Onorificenza di Cavaliere</h2>
      <p>Nel 1962 &egrave; nominato <strong>Cavaliere</strong> dell&rsquo;Ordine al Merito della Repubblica Italiana.</p>
      <p class="fonte">Fonte: archivio personale.</p>
    </figcaption>
    </div>
  </figure>

  <figure class="reveal-img side from-right align-top color-band" style="--band-color:#FCC1C1;">
    <div class="side-row">
      <a href="https://rechnerlexikon.de/it/artikel/Spezial:Patentpage&amp;details=Olivetti" target="_blank" rel="noopener">
      <img src="images/brevetto.webp" width="800" height="615" alt="Disegno di brevetto di calcolatore meccanico">
      <span class="img-badge">&#8599; Link</span>
    </a>
      <figcaption>
      <h2 class="visually-hidden">Brevetti</h2>
      <p><strong>Brevetti</strong> di Teresio depositati presso l&rsquo;Ufficio brevetti degli Stati Uniti (pdf del brevetto e anno di concessione accanto al nome).</p>
      <div class="text-window">
      <ul class="doc-list">
        <li><a href="pdf/US%203260449.pdf" target="_blank" rel="noopener">3,260,449</a>, 1966, Zero printing control device for a calculating machine.</li>
        <li><a href="pdf/US%203319882.pdf" target="_blank" rel="noopener">3,319,882</a>, 1967, Ten key calculating machine.</li>
        <li><a href="pdf/US%203331556.pdf" target="_blank" rel="noopener">3,331,556</a>, 1967, Power driving device for a calculating machine.</li>
        <li><a href="pdf/US%203370788.pdf" target="_blank" rel="noopener">3,370,788</a>, 1968, Program control device for a calculating or like machine.</li>
        <li><a href="pdf/US%203397837.pdf" target="_blank" rel="noopener">3,397,837</a>, 1968, Printing calculating machine having a transversely movable register.</li>
        <li><a href="pdf/US%203423018.pdf" target="_blank" rel="noopener">3,423,018</a>, 1969, Ten key calculating machine adapted to effect multiplications as well as divisions.</li>
        <li><a href="pdf/US%203451616.pdf" target="_blank" rel="noopener">3,451,616</a>, 1969, Automatic shortcut multiplication device for a calculating machine.</li>
      </ul>
      </div>
    </figcaption>
    </div>
    <div class="side-row fonte-row">
      <span class="side-row-spacer"></span>
      <p class="fonte">Fonte: <a href="https://rechnerlexikon.de/it/artikel/Spezial:Patentpage&amp;details=Olivetti" target="_blank" rel="noopener">Spezial:Patentpage</a> for &ldquo;Olivetti&rdquo;, <em>Rechnerlexikon</em>, <a href="https://worldwide.espacenet.com/searchResults?submitted=true&amp;locale=en_EP&amp;IN=Gassino+Teresio" target="_blank" rel="noopener">Patent Search</a> for &ldquo;inventor:Gassino Teresio&rdquo;, <em>Espacenet</em>, consultati nell&rsquo;agosto 2026.</p>
    </div>
  </figure>
</main>

    <p class="center-line">CAPO DELL&rsquo;ORDINE &ldquo;AL MERITO DELLA REPUBBLICA ITALIANA&bdquo;</p>

    <p>In <span class="fill">considerazione di particolari benemerenze</span><br>
    Sentita la Giunta dell&rsquo;Ordine al Merito della Repubblica Italiana<br>
    Sulla proposta del Presidente del Consiglio dei Ministri;<br>
    con Decreto in data <span class="fill">Roma 2 giugno 1962</span></p>

    <p class="center-line">HA CONFERITO</p>

    <p class="align-center">l&rsquo;onorificenza di <span class="fill">Cavaliere</span><br>
    <span class="fill">al Sig. Teresio Gassino</span></p>

    <p>con facolt&agrave; di fregiarsi delle insegne stabilite per tale classe.<br>
    Il Cancelliere dell&rsquo;Ordine Al Merito della Repubblica Italiana &egrave; incaricato dell&rsquo;esecuzione del presente Decreto che sar&agrave; registrato alla Cancelleria dell&rsquo;Ordine medesimo.</p>
