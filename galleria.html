<main id="main" tabindex="-1">
  <h1>Foto</h1>
  <p class="page-subtitle">Foto storiche dall&rsquo;archivio di famiglia.</p>

  <div class="gallery-grid">
    <figure class="reveal-img from-right">
      <button type="button" class="lightbox-trigger" data-caption="Teresio con i colleghi" data-src="images/galleria/foto-01.webp">
        <img src="images/galleria/foto-01-thumb.webp" width="800" height="517" alt="Teresio e colleghi seduti all'aperto a un tavolino">
      </button>
      <figcaption class="gallery-caption">Teresio con i colleghi</figcaption>
    </figure>
    <figure class="reveal-img from-right crop-top">
      <button type="button" class="lightbox-trigger" data-caption="Relax in montagna">
        <img src="images/galleria/foto-02.webp" width="464" height="542" alt="Teresio in montagna con maglione decorato, occhiali da sole e racchette da sci">
      </button>
      <figcaption class="gallery-caption">Relax in montagna</figcaption>
    </figure>
    <figure class="reveal-img from-right">
      <button type="button" class="lightbox-trigger" data-caption="Passione infinita per la montagna" data-src="images/galleria/foto-03.webp">
        <img src="images/galleria/foto-03-thumb.webp" width="800" height="659" alt="Teresio seduto in montagna con occhiali da sole scruta l'orizzonte">
      </button>
      <figcaption class="gallery-caption">Passione infinita per la montagna</figcaption>
    </figure>
    <figure class="reveal-img">
      <button type="button" class="lightbox-trigger" data-caption="Brevetto di volo" data-src="images/galleria/foto-04.webp">
        <img src="images/galleria/foto-04-thumb.webp" width="800" height="620" alt="Teresio di fronte ad aeroplano a elica con altre persone">
      </button>
      <figcaption class="gallery-caption">Brevetto di volo</figcaption>
    </figure>
    <figure class="reveal-img">
      <button type="button" class="lightbox-trigger" data-caption="La nomina a Cavaliere con il presidente Gronchi" data-src="images/galleria/foto-05.webp">
        <img src="images/galleria/foto-05-thumb.webp" width="800" height="1067" alt="Il Presidente Gronchi, di spalle, consegna l'onorificenza di Cavaliere a Teresio">
      </button>
      <figcaption class="gallery-caption">La nomina a Cavaliere con il presidente Gronchi</figcaption>
    </figure>
    <figure class="reveal-img">
      <button type="button" class="lightbox-trigger" data-caption="Relax a Monte Navale con Capellaro" data-src="images/galleria/foto-06.webp">
        <img src="images/galleria/foto-06-thumb.webp" width="800" height="548" alt="Teresio e Natale Capellaro in giardino nella casa di Monte Navale">
      </button>
      <figcaption class="gallery-caption">Relax a Monte Navale con Capellaro</figcaption>
    </figure>
  </div>
</main>
