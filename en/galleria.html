<main id="main" tabindex="-1">
  <h1>Photos</h1>
  <p class="page-subtitle">Historical photos from the family archive.</p>

  <div class="gallery-grid">
    <figure class="reveal-img from-right">
      <button type="button" class="lightbox-trigger" data-caption="Teresio with his colleagues" data-src="/images/galleria/foto-01.webp">
        <img src="/images/galleria/foto-01-thumb.webp" width="800" height="517" alt="Teresio and colleagues sitting outdoors at a small table">
      </button>
      <figcaption class="gallery-caption">Teresio with his colleagues</figcaption>
    </figure>
    <figure class="reveal-img from-right crop-top">
      <button type="button" class="lightbox-trigger" data-caption="Relaxing in the mountains">
        <img src="/images/galleria/foto-02.webp" width="464" height="542" alt="Teresio in the mountains wearing a patterned sweater and sunglasses, holding ski poles">
      </button>
      <figcaption class="gallery-caption">Relaxing in the mountains</figcaption>
    </figure>
    <figure class="reveal-img from-right">
      <button type="button" class="lightbox-trigger" data-caption="Infinite passion for the mountains" data-src="/images/galleria/foto-03.webp">
        <img src="/images/galleria/foto-03-thumb.webp" width="800" height="659" alt="Teresio sitting in the mountains in sunglasses, gazing at the horizon">
      </button>
      <figcaption class="gallery-caption">Infinite passion for the mountains</figcaption>
    </figure>
    <figure class="reveal-img">
      <button type="button" class="lightbox-trigger" data-caption="Pilot&rsquo;s licence" data-src="/images/galleria/foto-04.webp">
        <img src="/images/galleria/foto-04-thumb.webp" width="800" height="620" alt="Teresio in front of a propeller aircraft with other people">
      </button>
      <figcaption class="gallery-caption">Pilot&rsquo;s licence</figcaption>
    </figure>
    <figure class="reveal-img">
      <button type="button" class="lightbox-trigger" data-caption="The knighthood investiture with Italian President Gronchi" data-src="/images/galleria/foto-05.webp">
        <img src="/images/galleria/foto-05-thumb.webp" width="800" height="1067" alt="President Gronchi, seen from behind, presents Teresio with the Cavaliere honour">
      </button>
      <figcaption class="gallery-caption">The knighthood investiture with Italian President Gronchi</figcaption>
    </figure>
    <figure class="reveal-img">
      <button type="button" class="lightbox-trigger" data-caption="Relaxing at Monte Navale with Capellaro" data-src="/images/galleria/foto-06.webp">
        <img src="/images/galleria/foto-06-thumb.webp" width="800" height="548" alt="Teresio and Natale Capellaro in the garden at the Monte Navale house">
      </button>
      <figcaption class="gallery-caption">Relaxing at Monte Navale with Capellaro</figcaption>
    </figure>
  </div>
</main>
