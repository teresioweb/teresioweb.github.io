<main id="main" tabindex="-1">
  <h1>Photos</h1>
  <p class="page-subtitle">Historical photos from the family archive.</p>

  <div class="gallery-grid">
    <figure class="reveal-img from-right">
      <button type="button" class="lightbox-trigger" data-caption="Teresio with his colleagues">
        <img src="/images/galleria/foto-01.webp" width="1553" height="1003" alt="Teresio and colleagues sitting outdoors at a small table">
      </button>
      <figcaption class="gallery-caption">Teresio with his colleagues</figcaption>
    </figure>
    <figure class="reveal-img from-right crop-top">
      <button type="button" class="lightbox-trigger" data-caption="Relax in the mountains">
        <img src="/images/galleria/foto-02.webp" width="464" height="542" alt="Teresio in the mountains wearing a patterned sweater and sunglasses, holding ski poles">
      </button>
      <figcaption class="gallery-caption">Relax in the mountains</figcaption>
    </figure>
    <figure class="reveal-img from-right">
      <button type="button" class="lightbox-trigger" data-caption="Infinite passion for the mountains">
        <img src="/images/galleria/foto-03.webp" width="1261" height="1038" alt="Teresio sitting in the mountains in sunglasses, gazing at the horizon">
      </button>
      <figcaption class="gallery-caption">Infinite passion for the mountains</figcaption>
    </figure>
    <figure class="reveal-img">
      <button type="button" class="lightbox-trigger" data-caption="Flying patent">
        <img src="/images/galleria/foto-04.webp" width="1478" height="1145" alt="Teresio in front of a propeller aircraft with other people">
      </button>
      <figcaption class="gallery-caption">Flying patent</figcaption>
    </figure>
    <figure class="reveal-img">
      <button type="button" class="lightbox-trigger" data-caption="The knighthood investiture with Italian President Gronchi">
        <img src="/images/galleria/foto-05.webp" width="1200" height="1600" alt="President Gronchi, seen from behind, presents Teresio with the Cavaliere honour">
      </button>
      <figcaption class="gallery-caption">The knighthood investiture with Italian President Gronchi</figcaption>
    </figure>
    <figure class="reveal-img">
      <button type="button" class="lightbox-trigger" data-caption="Relax at home with Capellaro">
        <img src="/images/galleria/foto-06.webp" width="1600" height="1096" alt="Teresio and Natale Capellaro in the garden at the Monte Navale house">
      </button>
      <figcaption class="gallery-caption">Relax at home with Capellaro</figcaption>
    </figure>
  </div>
</main>
