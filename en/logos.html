<main id="main" tabindex="-1">
  <h1>Logos 27</h1>
  <p class="page-subtitle">&laquo;A jewel of ingenuity and creativity&raquo;.</p>

  <figure class="reveal-img side color-band" style="--band-color:#CEDCE6;">
    <div class="side-row">
      <a href="/pdf/NotizieOlivetti.pdf" target="_blank" rel="noopener">
      <img src="/images/logos-pintori.webp" width="1200" height="1204" alt="Graphic design by Giovanni Pintori for the Logos 27">
      <span class="img-badge">PDF</span>
    </a>
      <figcaption>
        <p>The Logos in four articles in <em>notizie olivetti</em> (Italian, multilingual <a href="/pdf/NotizieOlivettiMulti.pdf" target="_blank" rel="noopener">pdf available</a>*).<br>
      <strong>&gt; The Logos and the calculating machine market.</strong> An article by Francesco Mascaro, of the Olivetti Study Centre.<br>
      <strong>&gt; The Logos 27 project.</strong> A note by Teresio Gassino, who designed the machine together with a team of collaborators.<br>
      <strong>&gt; The design of the Logos 27.</strong> An article by architect Ettore Sottsass jr., who conceived the exterior of the new Olivetti calculator.<br>
      <strong>&gt; &ldquo;Where the Logos 27 is made&rdquo;.</strong></p>
      </figcaption>
    </div>
    <div class="side-row fonte-row">
      <span class="side-row-spacer"></span>
      <p class="fonte">Source: monthly company magazine <em>notizie olivetti, n. 85, dicembre 1965</em>, Ufficio Stampa Olivetti, pp. 32&ndash;49. *Translations of the first three articles from the final section of the magazine (unpaginated, without images).</p>
    </div>
  </figure>

  <figure class="reveal-img side from-right color-band" style="--band-color:#FCC1C1;">
    <div class="side-row">
      <a href="/pdf/Opuscolo1.pdf" target="_blank" rel="noopener">
      <img src="/images/logos-opuscolo.webp" width="800" height="563" alt="Cover of the Logos 27-2 information brochure">
      <span class="img-badge">PDF</span>
    </a>
      <figcaption>
        <p><strong>Olivetti Logos 27-2</strong> brochure (1967).<br>
      A brochure featuring graphic design by Giovanni Pintori showcased the Logos 27-1 version (1966, <a href="/pdf/Opuscolo2.pdf" target="_blank" rel="noopener">pdf&nbsp;available</a> in Dutch). A video sequence showcased the Logos along with other Olivetti products (<a href="https://www.youtube.com/watch?v=lfbH4H8zvMU" target="_blank" rel="noopener">link</a>).</p>
        <p class="fonte">Source: <a href="https://archive.org/details/olivettilogos272/" target="_blank" rel="noopener">Olivetti Logos&nbsp;27-2</a>, <em>Internet Archive</em>, <a href="https://oa.letterformarchive.org/item?workID=lfa_pintori_0011" target="_blank" rel="noopener">Olivetti Logos&nbsp;27</a>, <em>Letterform Archive</em>, accessed in November 2020.</p>
      </figcaption>
    </div>
  </figure>

  <figure class="reveal-img side color-band" style="--band-color:#FEE8B2;">
    <div class="side-row">
      <a href="https://web.archive.org/web/20190709182245/http://ananke.blog.lemonde.fr/tag/logos-27-2/" target="_blank" rel="noopener">
      <img src="/images/ranimer-belle-mecanique.webp" width="800" height="533" alt="Overhead view of the Logos 27’s mechanics">
      <span class="img-badge">&#8599; Link</span>
    </a>
      <figcaption>
        <p><strong><span lang="fr">Ranimer une belle m&eacute;canique</span>, la super-calculatrice Logos&nbsp;27-2</strong> (&ldquo;Reviving a piece of beautiful mechanics&rdquo;, 2013, French).<br>
      Philippe Bastide, an engineer and enthusiast of mechanical calculating machines, details his analysis and reverse-engineering attempt on the Logos 27-2, to restore it to working order. Alain Billerey&rsquo;s expertise contributed to this effort&mdash;himself an enthusiast and collector of such machines (he can be seen at this <a href="https://www.youtube.com/watch?v=8Ra22FApGu0" target="_blank" rel="noopener">video&nbsp;link</a>, demonstrating the Logos, Divisumma and Tetractys from his collection in operation).</p>
      </figcaption>
    </div>
    <div class="side-row fonte-row">
      <span class="side-row-spacer"></span>
      <p class="fonte">Source: <a href="https://web.archive.org/web/20190709182245/http://ananke.blog.lemonde.fr/tag/logos-27-2/" target="_blank" rel="noopener"><em>L&rsquo;oeil num&eacute;rique</em></a> (<em>Internet Archive</em>), archived in July 2019.</p>
    </div>
  </figure>

  <figure class="reveal-img side from-right color-band" style="--band-color:#FFDDC2;">
    <div class="side-row">
      <a href="https://archive.org/details/mc-27-einstellungen-rid" target="_blank" rel="noopener">
      <img src="/images/einstellungen.webp" width="800" height="566" alt="Cover of the Einstellungen adjustment manual">
      <span class="img-badge img-badge-left">&#8599; Link</span>
    </a>
      <figcaption>
        <p><strong>Olivetti Logos 27 <span lang="de">Einstellungen</span></strong>, adjustment manual (1968, German).<br>
      STAC technicians (<a href="https://www.storiaolivetti.it/articolo/108-organizzazione-e-formazione-per-lassistenza-te/" target="_blank" rel="noopener">Servizio Tecnico Assistenza Clienti</a>, Olivetti&rsquo;s own customer technical service) had, besides the adjustment manual, a <em>Parts Locator</em> guide (1969, <a href="https://archive.org/details/mc-27-glp-rid" target="_blank" rel="noopener">link</a>) with spatial coordinates for locating sections of the machine and precisely diagnosing a malfunction using the fault-search manual (<em>Logos 27-2 <span lang="de">Fehlersuche</span></em>, 1968, <a href="https://archive.org/details/mc-27-fehlerreparatur-alles-rid" target="_blank" rel="noopener">link</a> in German).</p>
      </figcaption>
    </div>
    <div class="side-row fonte-row">
      <span class="side-row-spacer"></span>
      <p class="fonte">Source: <em>Internet Archive</em>, links accessed in August 2026.</p>
    </div>
  </figure>
