<main id="main">
  <h1>Curriculum</h1>
  <p class="page-subtitle">The professional journey from Olivetti CFM trainee to Central Director.</p>

  <figure class="reveal-img side from-right align-top color-band" style="--band-color:#FFDDC2;">
    <div class="side-row">
      <a href="/images/curriculum-fronte.jpg" target="_blank" rel="noopener">
      <img src="/images/curriculum-fronte.webp" width="1200" height="849" alt="Two-page scan of the curriculum vitae">
      <span class="img-badge">&#10530; Image</span>
    </a>
      <figcaption>
      <p><strong>Curriculum vitae</strong> typescript by Teresio, presumably written after he was promoted to executive manager in 1956, when he was technical coordinator of all projects across all departments (&ldquo;Calculating Machines Projects&rdquo;, &ldquo;Special Machines Studies and Projects&rdquo;, &ldquo;Special Equipment Projects&rdquo;) and working directly on some of the projects.</p>
      <p class="fonte">Source: personal archive (<a href="/pdf/Curriculum.pdf" target="_blank" rel="noopener">pdf&nbsp;available</a>).</p>
    </figcaption>
    </div>
  </figure>

  <figure class="reveal-img side from-right align-top color-band" style="--band-color:#FEE8B2;">
    <div class="side-row">
      <a href="/images/diploma-cfm.jpg" target="_blank" rel="noopener">
      <img src="/images/diploma-cfm.webp" width="800" height="565" alt="Scan of the CFM qualification certificate for Draughtsmen">
      <span class="img-badge">&#10530; Image</span>
    </a>
      <figcaption>
      <p>In 1942 he qualified as a <strong>Disegnatore</strong> (draughtsman) from the Olivetti <em>Centro Formazione Meccanici</em> (&ldquo;Mechanical Training Centre&rdquo;).</p>
      <p class="fonte">Source: personal archive.</p>
    </figcaption>
    </div>
  </figure>

  <figure class="reveal-img side from-right align-top crop-top color-band" style="--band-color:#CEDCE6;">
    <div class="side-row">
      <a href="/images/teresio-cavaliere.jpg" target="_blank" rel="noopener">
      <img src="/images/teresio-cavaliere.webp" width="800" height="1090" alt="Diploma of the Cavaliere honour">
      <span class="img-badge">&#10530; Image</span>
    </a>
      <figcaption>
      <p>In 1962 he was awarded the honorary title of <strong>Cavaliere</strong> <em>dell&rsquo;Ordine al Merito della Repubblica Italiana</em> (&ldquo;Knight of the Order of Merit of the Italian Republic&rdquo;).</p>
      <p class="fonte">Source: personal archive.</p>
    </figcaption>
    </div>
  </figure>

  <figure class="reveal-img side from-right align-top color-band" style="--band-color:#FCC1C1;">
    <div class="side-row">
      <a href="https://rechnerlexikon.de/en/artikel/Spezial:Patentpage&amp;details=Olivetti" target="_blank" rel="noopener">
      <img src="/images/brevetto.webp" width="800" height="615" alt="Patent drawing of a mechanical calculator">
      <span class="img-badge">&#8599; Link</span>
    </a>
      <figcaption>
      <p><strong>Patents</strong> by Teresio filed around 1966 with the United States Patent Office (patent pdf and year granted before each title).</p>
      <div class="text-window">
      <p>&gt; <a href="/pdf/US%203260449.pdf" target="_blank" rel="noopener">3,260,449</a>, 1966, Zero printing control device for a calculating machine.<br>
      &gt; <a href="/pdf/US%203319882.pdf" target="_blank" rel="noopener">3,319,882</a>, 1967, Ten key calculating machine.<br>
      &gt; <a href="/pdf/US%203331556.pdf" target="_blank" rel="noopener">3,331,556</a>, 1967, Power driving device for a calculating machine.<br>
      &gt; <a href="/pdf/US%203370788.pdf" target="_blank" rel="noopener">3,370,788</a>, 1968, Program control device for a calculating or like machine.<br>
      &gt; <a href="/pdf/US%203397837.pdf" target="_blank" rel="noopener">3,397,837</a>, 1968, Printing calculating machine having a transversely movable register.<br>
      &gt; <a href="/pdf/US%203423018.pdf" target="_blank" rel="noopener">3,423,018</a>, 1969, Ten key calculating machine adapted to effect multiplications as well as divisions.<br>
      &gt; <a href="/pdf/US%203451616.pdf" target="_blank" rel="noopener">3,451,616</a>, 1969, Automatic shortcut multiplication device for a calculating machine.</p>
      </div>
    </figcaption>
    </div>
    <div class="side-row fonte-row">
      <span class="side-row-spacer"></span>
      <p class="fonte">Source: <a href="https://www.arithmeum.uni-bonn.de/sammlungen/rechnen-einst/objekt.html?tx_arithinventory%5Bobject%5D=8410&amp;L=0" target="_blank" rel="noopener"><em>Arithmeum</em></a>, University of Bonn, <a href="https://rechnerlexikon.de/en/artikel/Spezial:Patentpage&amp;details=Olivetti" target="_blank" rel="noopener"><em>Spezial:Patentpage (Olivetti)</em></a>, Rechnerlexikon, accessed in August 2026.</p>
    </div>
  </figure>
